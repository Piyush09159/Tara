<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tara Runtime Recovery Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 30px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h1>Tara Runtime Recovery Test</h1>

    <div class="field">
        <label for="firstName">
            First name:
        </label>

        <input
            id="firstName"
            name="fname"
            type="text"
            value="John"
        >
    </div>

    <div class="field">
        <label for="backupFirstName">
            Alternate field:
        </label>

        <input
            id="backupFirstName"
            name="backup_first"
            type="text"
            value=""
        >
    </div>

</body>
</html>
